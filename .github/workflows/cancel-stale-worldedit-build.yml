name: Cancel superseded WorldEdit browser build

on:
  push:
    branches:
      - worldedit/adapter-foundation
    paths:
      - ".github/workflows/cancel-stale-worldedit-build.yml"

permissions:
  actions: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Cancel the run with the known missing-music failure
        uses: actions/github-script@v7
        with:
          script: |
            const runId = 41683137157;
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId
            });
            if (run.status === "queued" || run.status === "in_progress") {
              await github.rest.actions.cancelWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId
              });
              core.info(`Cancelled superseded build #${run.run_number} before its known missing-music failure.`);
            } else {
              core.info(`Old build already finished with status=${run.status}, conclusion=${run.conclusion}.`);
            }
