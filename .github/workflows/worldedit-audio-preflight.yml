name: WorldEdit browser audio packaging preflight

on:
  push:
    branches:
      - worldedit/adapter-foundation
    paths:
      - ".github/workflows/worldedit-audio-preflight.yml"
      - "wasm-toolchain/build-single-html.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worldedit/adapter-foundation
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - name: Check standalone packager syntax and optional audio handling
        run: |
          node --check wasm-toolchain/build-single-html.js
          node - <<'NODE'
          const fs = require("fs");
          const source = fs.readFileSync("wasm-toolchain/build-single-html.js", "utf8");
          for (const required of [
            'if (!sounds)',
            'if (sounds) payloads.push(payloadTag("eag-inline-sounds", sounds));',
            'omitting optional sound pack'
          ]) {
            if (!source.includes(required)) throw new Error("Missing optional-audio handling: " + required);
          }
          const html = [
            '<link rel="preload" href="sounds.epk?v=build" as="fetch" crossorigin="anonymous" />',
            '            { url: "sounds.epk?v=build", path: "" }'
          ].join("\n");
          const stripped = html
            .replace(/^\s*<link rel="preload" href="sounds\.epk(?:\?v=[^"]*)?"[^>]*\/?>\s*$/gm, "")
            .replace(/^\s*\{\s*url:\s*"sounds\.epk(?:\?v=[^"]*)?",\s*path:\s*""\s*\},?\s*$/gm, "");
          if (/sounds\.epk/.test(stripped)) throw new Error("Optional sounds reference survived stripping");
          console.log("Packager syntax and missing-sounds fallback passed");
          NODE
      - name: Validate browser build workflow YAML
        run: ruby -e 'require "yaml"; YAML.load_file(".github/workflows/worldedit-browser-build.yml", aliases: true); puts "Browser build workflow YAML is valid"'
      - name: Discover audio and EPK tasks
        shell: bash
        run: |
          set -o pipefail
          ./gradlew tasks --all --console=plain --no-daemon | grep -i -E 'sound|epk|asset'
