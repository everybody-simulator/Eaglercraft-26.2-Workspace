name: Build WorldEdit browser test client

on:
  push:
    branches:
      - worldedit/adapter-foundation
    paths:
      - "game/**"
      - "platform/**"
      - "platform-teavm/**"
      - "teavm-compat/**"
      - "target_teavm_wasm_gc/**"
      - "target_teavm_wasm_gc_mesh/**"
      - "target_teavm_wasm_gc_server/**"
      - "wasm-toolchain/**"
      - "worldedit-eagler/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - "gradle.properties"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

# Do not cancel a running TeaVM link when another source commit is pushed.
# GitHub may keep only the newest pending run, but the active build is allowed to finish.
concurrency:
  group: worldedit-browser-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Compile and package standalone browser client
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out this branch
        uses: actions/checkout@v4
        with:
          ref: worldedit/adapter-foundation

      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Restore completed precise Wasm links
        id: wasm-link-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            target_teavm_wasm_gc/build/generated/teavm/wasm-gc/classes.wasm
            target_teavm_wasm_gc/build/generated/teavm/wasm-gc/classes.wasm.link-mode
            target_teavm_wasm_gc/build/generated/teavm/wasm-gc/classes.wasm-runtime.js
            target_teavm_wasm_gc_mesh/build/generated/teavm/wasm-gc/mesh-worker.wasm
            target_teavm_wasm_gc_mesh/build/generated/teavm/wasm-gc/mesh-worker.wasm.link-mode
            target_teavm_wasm_gc_server/build/generated/teavm/wasm-gc/server-worker.wasm
            target_teavm_wasm_gc_server/build/generated/teavm/wasm-gc/server-worker.wasm.link-mode
          key: worldedit-wasm-precise-${{ runner.os }}-temurin25-${{ hashFiles('build.gradle.kts', 'settings.gradle.kts', 'gradle/**', 'gradle.properties', 'gradlew', 'game/src/main/java/**', 'game/build.gradle.kts', 'worldedit-eagler/src/**', 'worldedit-eagler/build.gradle.kts', 'platform/src/**', 'platform/build.gradle.kts', 'platform-teavm/src/**', 'platform-teavm/build.gradle.kts', 'teavm-compat/src/**', 'teavm-compat/build.gradle.kts', 'wasm-toolchain/teavm-eagler-patch/**', 'wasm-toolchain/StandaloneTeaVMLinker.java', 'wasm-toolchain/standalone-classpaths.js', 'wasm-toolchain/standalone-link-cache.js', 'wasm-toolchain/field-overlay-link.js', 'wasm-toolchain/link-web-target-standalone.js', 'wasm-toolchain/link-server-standalone.js', 'wasm-toolchain/build-server-fastutil-slice.js', 'wasm-toolchain/run-memory-capped.js', 'target_teavm_wasm_gc/src/**', 'target_teavm_wasm_gc/build.gradle.kts', 'target_teavm_wasm_gc_mesh/src/**', 'target_teavm_wasm_gc_mesh/build.gradle.kts', 'target_teavm_wasm_gc_server/src/**', 'target_teavm_wasm_gc_server/build.gradle.kts') }}

      - name: Validate and refresh restored precise links
        if: steps.wasm-link-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for artifact in \
            target_teavm_wasm_gc/build/generated/teavm/wasm-gc/classes.wasm \
            target_teavm_wasm_gc_mesh/build/generated/teavm/wasm-gc/mesh-worker.wasm \
            target_teavm_wasm_gc_server/build/generated/teavm/wasm-gc/server-worker.wasm; do
            test -s "$artifact"
            test "$(cat "$artifact.link-mode")" = "precise"
            touch "$artifact"
          done
          test -s target_teavm_wasm_gc/build/generated/teavm/wasm-gc/classes.wasm-runtime.js
          touch target_teavm_wasm_gc/build/generated/teavm/wasm-gc/classes.wasm-runtime.js

      - name: Build standalone Minecraft HTML from cached precise links
        if: steps.wasm-link-cache.outputs.cache-hit == 'true'
        run: node wasm-toolchain/build-single-html.js --reuse-client --reuse-mesh --reuse-server --output worldedit-eaglercraft-26.2.html
        env:
          EAGLER_BUILD_CAP_MIB: "13312"

      - name: Build standalone Minecraft HTML
        if: steps.wasm-link-cache.outputs.cache-hit != 'true'
        run: node wasm-toolchain/build-single-html.js --output worldedit-eaglercraft-26.2.html
        env:
          EAGLER_BUILD_CAP_MIB: "13312"

      - name: Verify precise Wasm outputs for cache
        id: wasm-cache-ready
        if: always() && steps.wasm-link-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          for artifact in \
            target_teavm_wasm_gc/build/generated/teavm/wasm-gc/classes.wasm \
            target_teavm_wasm_gc_mesh/build/generated/teavm/wasm-gc/mesh-worker.wasm \
            target_teavm_wasm_gc_server/build/generated/teavm/wasm-gc/server-worker.wasm; do
            test -s "$artifact"
            test "$(cat "$artifact.link-mode")" = "precise"
          done
          test -s target_teavm_wasm_gc/build/generated/teavm/wasm-gc/classes.wasm-runtime.js

      - name: Save completed precise Wasm links
        if: always() && steps.wasm-cache-ready.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            target_teavm_wasm_gc/build/generated/teavm/wasm-gc/classes.wasm
            target_teavm_wasm_gc/build/generated/teavm/wasm-gc/classes.wasm.link-mode
            target_teavm_wasm_gc/build/generated/teavm/wasm-gc/classes.wasm-runtime.js
            target_teavm_wasm_gc_mesh/build/generated/teavm/wasm-gc/mesh-worker.wasm
            target_teavm_wasm_gc_mesh/build/generated/teavm/wasm-gc/mesh-worker.wasm.link-mode
            target_teavm_wasm_gc_server/build/generated/teavm/wasm-gc/server-worker.wasm
            target_teavm_wasm_gc_server/build/generated/teavm/wasm-gc/server-worker.wasm.link-mode
          key: worldedit-wasm-precise-${{ runner.os }}-temurin25-${{ hashFiles('build.gradle.kts', 'settings.gradle.kts', 'gradle/**', 'gradle.properties', 'gradlew', 'game/src/main/java/**', 'game/build.gradle.kts', 'platform/src/**', 'platform/build.gradle.kts', 'platform-teavm/src/**', 'platform-teavm/build.gradle.kts', 'teavm-compat/src/**', 'teavm-compat/build.gradle.kts', 'wasm-toolchain/teavm-eagler-patch/**', 'wasm-toolchain/StandaloneTeaVMLinker.java', 'wasm-toolchain/standalone-classpaths.js', 'wasm-toolchain/standalone-link-cache.js', 'wasm-toolchain/field-overlay-link.js', 'wasm-toolchain/link-web-target-standalone.js', 'wasm-toolchain/link-server-standalone.js', 'wasm-toolchain/build-server-fastutil-slice.js', 'wasm-toolchain/run-memory-capped.js', 'target_teavm_wasm_gc/src/**', 'target_teavm_wasm_gc/build.gradle.kts', 'target_teavm_wasm_gc_mesh/src/**', 'target_teavm_wasm_gc_mesh/build.gradle.kts', 'target_teavm_wasm_gc_server/src/**', 'target_teavm_wasm_gc_server/build.gradle.kts') }}

      - name: Upload playable HTML
        uses: actions/upload-artifact@v4
        with:
          name: worldedit-eaglercraft-26.2-browser-client
          path: worldedit-eaglercraft-26.2.html
          if-no-files-found: error
          retention-days: 7
