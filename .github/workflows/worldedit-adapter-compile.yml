name: WorldEdit adapter compile

on:
  push:
    branches:
      - worldedit/adapter-foundation
    paths:
      - "worldedit-eagler/**"
      - "game/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile Minecraft game and WorldEdit adapter
        run: ./gradlew :game:compileJava :worldedit-eagler:compileJava --console=plain --no-daemon
